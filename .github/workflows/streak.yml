name: Update streak card
on:
  schedule:
    - cron: "20 16 * * *"
    - cron: "5 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bagasadh/termcard@v1
        with:
          config: termcard.json
          output_dir: assets
          readme: README.md
          token: ${{ secrets.STREAK_TOKEN }}
          commit_message: "Update profile cards"
