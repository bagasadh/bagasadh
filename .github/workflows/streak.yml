name: Update streak card
on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/streak.py
        env:
          GITHUB_TOKEN: ${{ secrets.STREAK_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-card.svg
          git diff --cached --quiet || (git commit -m "Update streak card" && git push)

